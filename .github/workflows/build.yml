name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean qassimz-organizer.spec
      - name: Arabic language file for the installer
        shell: pwsh
        run: Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Arabic.isl -OutFile installer/Arabic.isl
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\setup.iss'
        shell: pwsh
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist/QASSIMZ Organizer/*" -DestinationPath "dist/QASSIMZ-Organizer-Portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: QASSIMZ-Organizer
          path: |
            dist/QASSIMZ-Organizer-Setup-*.exe
            dist/QASSIMZ-Organizer-Portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QASSIMZ-Organizer-Setup-*.exe
            dist/QASSIMZ-Organizer-Portable.zip
