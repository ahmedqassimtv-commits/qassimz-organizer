name: Build & Release

# Every push to main: read VERSION from app/main.py.
# If release vX.Y.Z doesn't exist yet → build Setup + Portable and publish it.
# Installed apps see the new release and update themselves.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP '^VERSION = "\K[^"]+' app/main.py)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean qassimz-organizer.spec
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Arabic language file for the installer
        shell: pwsh
        continue-on-error: true
        run: |
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $found = Get-ChildItem -Path $inno -Recurse -Filter "Arabic.isl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Copy-Item $found.FullName installer/Arabic.isl; exit 0 }
          foreach ($u in @(
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Arabic.isl",
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Arabic.isl",
            "https://jrsoftware.org/files/istrans/Arabic/Arabic.isl")) {
            try { Invoke-WebRequest $u -OutFile installer/Arabic.isl -ErrorAction Stop; exit 0 } catch {}
          }
          Write-Host "Arabic.isl not found - installer will be English only"
      - name: Build installer
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.tag }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$ver" installer\setup.iss
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist/QASSIMZ Organizer/*" -DestinationPath "dist/QASSIMZ-Organizer-Portable.zip"
      - name: Build Delta Package (.qpkg + manifest.json)
        shell: pwsh
        run: |
          $ver = ${{ needs.version.outputs.ver }}
          $ver = ($ver -replace '^[vV]', '')
          if (-not $ver) { $ver = '1.0.0' }
          Invoke-WebRequest "https://raw.githubusercontent.com/ahmedqassimtv-commits/qassimz-hub/main/tools/qpkg_packager.py" -OutFile "qpkg_packager.py" -UseBasicParsing
          python qpkg_packager.py pack --input "dist/QASSIMZ Organizer" --output-dir "dist/delta" --app-id "qassimz-organizer" --version "$ver"
          python qpkg_packager.py verify --manifest "dist/delta/manifest.json" --qpkg "dist/delta/qassimz-organizer-v$ver.qpkg"

      - uses: actions/upload-artifact@v4
        with:
          name: QASSIMZ-Organizer
          path: |
            dist/QASSIMZ-Organizer-Setup-*.exe
            dist/QASSIMZ-Organizer-Portable.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QASSIMZ Organizer ${{ needs.version.outputs.tag }}
          make_latest: true
          body: |
            ## ⬇️ التحميل
            - **QASSIMZ-Organizer-Setup** — التسطيب العادي (موصى بيه، وبيحدّث نفسه)
            - **Portable.zip** — من غير تسطيب
            dist/delta/manifest.json
            dist/delta/*.qpkg

            لو ظهرت شاشة SmartScreen: **More info ← Run anyway**.
            اللي مسطّب نسخة قديمة هيظهرله «تحديث جديد» جوه البرنامج.
          files: |
            dist/QASSIMZ-Organizer-Setup-*.exe
            dist/QASSIMZ-Organizer-Portable.zip
            dist/delta/manifest.json
            dist/delta/*.qpkg
