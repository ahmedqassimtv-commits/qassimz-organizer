<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C3E33"/>
      <stop offset="55%" stop-color="#0A2E27"/>
      <stop offset="100%" stop-color="#0A2721"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3AC997"/>
      <stop offset="100%" stop-color="#0EB17C"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FD1A2"/>
      <stop offset="48%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <clipPath id="squircleClip">
